<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>electron-notify-manager demo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(1200px 600px at 30% 20%, rgba(79, 142, 247, 0.25), transparent 55%),
          radial-gradient(900px 500px at 70% 70%, rgba(182, 84, 255, 0.18), transparent 55%),
          #0b0e14;
        color: rgba(255, 255, 255, 0.92);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 28px 22px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0 0 18px;
        color: rgba(255, 255, 255, 0.7);
      }
      .card {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px) saturate(140%);
        -webkit-backdrop-filter: blur(12px) saturate(140%);
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.92);
        padding: 10px 12px;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
        font-weight: 600;
      }
      button:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.09);
        border-color: rgba(79, 142, 247, 0.45);
      }
      .log {
        margin-top: 16px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(0, 0, 0, 0.25);
        color: rgba(255, 255, 255, 0.75);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        line-height: 1.5;
        height: 160px;
        overflow: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>electron-notify-manager demo</h1>
      <p>Test the package behavior with the buttons below.</p>

      <div class="card">
        <div class="row">
          <button id="btn-show">Show notification</button>
          <button id="btn-sticky">Show sticky</button>
          <button id="btn-image">With Image</button>
          <button id="btn-close-all">Close all</button>
        </div>
        <div class="log" id="log"></div>
      </div>
    </div>

    <script>
      const { ipcRenderer } = require('electron');
      const logEl = document.getElementById('log');

      function log(msg) {
        const line = `[${new Date().toLocaleTimeString()}] ${msg}\n`;
        logEl.textContent = line + logEl.textContent;
      }

      document.getElementById('btn-show').addEventListener('click', async () => {
        const id = await ipcRenderer.invoke('demo-show');
        log(`Show notification -> id=${id}`);
      });

      document.getElementById('btn-sticky').addEventListener('click', async () => {
        const id = await ipcRenderer.invoke('demo-show-sticky');
        log(`Show sticky -> id=${id}`);
      });

      document.getElementById('btn-image').addEventListener('click', async () => {
        const id = await ipcRenderer.invoke('demo-show-image');
        log(`Show with image -> id=${id}`);
      });

      document.getElementById('btn-close-all').addEventListener('click', async () => {
        await ipcRenderer.invoke('demo-close-all');
        log('Close all');
      });

      ipcRenderer.on('demo-log', (_evt, msg) => log(msg));
    </script>
  </body>
</html>
